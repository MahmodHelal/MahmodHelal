<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Mahmoud Helal — Automation QA Engineer</title>
  <desc id="desc">Animated profile banner for Mahmoud Helal, Software Tester and Automation QA Engineer.</desc>
  <rect width="1200" height="260" rx="24" fill="#0d1117"/>
  <rect x="2" y="2" width="1196" height="256" rx="22" fill="none" stroke="#30363d" stroke-width="2"/>
  <text x="60" y="92" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700">Mahmoud Helal</text>
  <text x="60" y="136" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="24">Software Tester • Automation QA Engineer • SDET path</text>
  <text x="60" y="184" fill="#58a6ff" font-family="monospace" font-size="24">
    <tspan>Java + Selenium + TestNG + Cucumber</tspan>
    <animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite"/>
  </text>
  <text x="60" y="184" fill="#58a6ff" font-family="monospace" font-size="24" opacity="0">
    <tspan>API + SQL + Performance + Quality Engineering</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0" dur="5s" repeatCount="indefinite"/>
  </text>
  <circle cx="1110" cy="82" r="10" fill="#3fb950">
    <animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="1080" y="120" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="14">QUALITY FIRST</text>
</svg>
